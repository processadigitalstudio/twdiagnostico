<!DOCTYPE html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<title>Tu resultado — Tweetalig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="notranslate">

<div class="page-center top">
  <div class="card result-card" style="max-width:760px;">
    <div class="brand-bar" id="brandBar"></div>

    <div id="waiting" style="text-align:center; padding:30px 0;">
      <div class="spinner"></div>
      <h2>Calculando tu resultado…</h2>
      <p class="muted" id="waitingMsg">Tus respuestas ya quedaron guardadas. En unos segundos verás tu nivel.</p>
    </div>

    <div id="resultView" style="display:none;"></div>
  </div>
</div>

<script type="module">
import { watchResult } from "./js/exam-engine.js";
import { CANDO } from "./js/cando.js";
import { resolveInstitution, renderBrand, currentInstitutionSlug } from "./js/institutions.js";
import { ROUTE_STEPS, ROUTE_BY_LEVEL, routeCards } from "./js/routes.js";

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const params = new URLSearchParams(location.search);
let sessionId = params.get("s");
try { sessionId = sessionId || localStorage.getItem("lastSessionId"); } catch (e) {}

let inst = resolveInstitution(currentInstitutionSlug());
renderBrand(document.getElementById("brandBar"), inst);

const waiting = document.getElementById("waiting");
const view = document.getElementById("resultView");

if (!sessionId) {
  document.querySelector("#waiting h2").textContent = "No encontramos tu resultado";
  document.querySelector("#waiting .spinner").style.display = "none";
  document.getElementById("waitingMsg").textContent = "Avisa al supervisor de la aplicación.";
} else {
  const slowTimer = setTimeout(() => {
    document.getElementById("waitingMsg").textContent =
      "Tu resultado todavía se está procesando. Mantén esta página abierta: aparecerá automáticamente. Si tarda más de unos minutos, avisa al supervisor.";
  }, 45000);

  watchResult(sessionId, (r) => {
    if (!r) return;
    clearTimeout(slowTimer);
    render(r);
  });
}


// ---------- Ruta según el resultado ----------
function routeCardHtml(key, card, recommended) {
  const li = (arr) => arr.map(x => `<li>${esc(x)}</li>`).join("");
  const dl = (rows) => rows.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("");
  const isMe = (lv) => lv === card.highlightPrice;
  const prices = card.highlightPrice !== undefined
    ? `<div class="route-price-grid">${card.price.map(([lv, v]) => `<span class="${isMe(lv) ? "me" : ""}"><b>${esc(lv)}</b> ${esc(v)}</span>`).join("")}</div>`
    : `<dl class="route-dl">${dl(card.price)}</dl>`;
  return `<div class="route-card ${recommended ? "rec" : ""}">
    ${recommended ? `<span class="route-badge">Recomendado para ti</span>` : ""}
    <div class="route-step">${esc(card.step)}</div>
    <h4>${esc(card.title)}</h4>
    <p>${esc(card.what)}</p>
    <ul>${li(card.facts)}</ul>
    ${card.startNote ? `<p class="route-start"><b>${esc(card.startNote)}</b></p>` : ""}
    <div class="route-sub">${esc(card.priceTitle || "Valor")}</div>${prices}
    <div class="route-sub">Fechas</div>${card.dateGroups
      ? card.dateGroups.map(g => `<div class="route-grp">${esc(g.title)}</div><dl class="route-dl">${dl(g.rows)}</dl>`).join("")
      : `<dl class="route-dl">${dl(card.dates)}</dl>`}
    ${card.payNote ? `<div class="route-pay">💳 ${esc(card.payNote)}</div>` : ""}
  </div>`;
}

function routeSection(level, instSlug) {
  const plan = ROUTE_BY_LEVEL[level] || ROUTE_BY_LEVEL.A1;
  const cards = routeCards(level, instSlug);
  const chips = ROUTE_STEPS.map((st, i) => `<div class="route-chip ${[].concat(plan.entry).includes(st.id) ? "here" : ""}"><span>${i + 1}</span><b>${esc(st.name)}</b><small>${esc(st.sub)}</small></div>`).join('<i class="route-arrow">›</i>');
  const rec = plan.recommended.map(k => routeCardHtml(k, cards[k], true)).join("");
  const others = plan.others.map(k => routeCardHtml(k, cards[k], false)).join("");
  return `<div class="route-box">
    <div class="eyebrow">Tu ruta</div>
    <h3>${esc(plan.headline)}</h3>
    <p class="muted" style="margin:0 0 14px;">Según tu resultado, estas son las recomendaciones. Revísalas e inscríbete ahora.</p>
    <div class="route-chips">${chips}</div>
    <p class="route-text">${esc(plan.text)}</p>
    ${rec}
    ${others ? `<details class="route-more"><summary>Ver otras opciones</summary>${others}</details>` : ""}
  </div>`;
}

// ---------- Aviso: el resultado llega por correo ----------
function emailNotice() {
  let mail = "";
  try { mail = (JSON.parse(sessionStorage.getItem("profile") || "{}").email) || ""; } catch (e) {}
  return `<div class="email-box">
    <h4>Tu resultado también llegará a tu correo</h4>
    <p style="margin:0;">Tus resultados serán enviados ${mail ? "a <b>" + esc(mail) + "</b>" : "al correo que registraste"} en las próximas 24 horas.</p>
  </div>`;
}

function render(r) {
  // la institución guardada en el resultado manda sobre la del navegador
  if (r.institution) { inst = resolveInstitution(r.institution); renderBrand(document.getElementById("brandBar"), inst); }
  const c = CANDO[r.level] || CANDO.A1;
  const colors = { UoL: "var(--teal)", Reading: "var(--gold)", Listening: "var(--ink)" };
  const LABELS = { UoL: "Language Use", Reading: "Reading Comprehension", Listening: "Listening Comprehension" };
  const rows = ["UoL", "Reading", "Listening"].map(sk => {
    const p = r.points[sk];
    const pct = p.max > 0 ? Math.round((p.earned / p.max) * 100) : 0;
    return `<div class="skill-row"><span>${LABELS[sk]}</span>
      <div class="bar"><div style="width:${pct}%; background:${colors[sk]};"></div></div>
      <span class="val">${p.earned.toFixed(1)} / ${p.max.toFixed(0)}</span></div>`;
  }).join("");

  const cta = inst.enrollUrl
    ? `<div class="cta-box cta-only"><h3>Ya conoces tu ruta</h3><a class="cta-btn" href="${esc(inst.enrollUrl)}" target="_blank" rel="noopener">Inscríbete ya →</a></div>`
    : (inst.contact ? `<div class="cta-box"><h3>¿Quieres inscribirte?</h3><p>Escríbenos a ${esc(inst.contact)}</p></div>` : "");

  view.innerHTML = `
    <div class="result-hero lvl-${esc(r.level)}">
      <div class="eyebrow">${r.name ? esc(r.name) + " · " : ""}Tu resultado</div>
      <div class="result-level">${esc(r.level)}</div>
      <div><span class="lvl-pill ${esc(r.level)}">Nivel ${esc(r.level)} · ${esc(c.name)}</span></div>
      <div class="result-score">Puntaje total: <b>${r.finalScore.toFixed(1)}</b> / 100</div>
    </div>

    <div class="skill-rows">${rows}</div>

    <div class="cando-box lvl-${esc(r.level)}">
      <div class="eyebrow">Nivel ${esc(r.level)} · ${esc(c.range)}</div>
      <h3>Tu resultado indica un nivel ${esc(r.level)} según el Marco Común Europeo de Referencia (MCER)</h3>
      <p class="muted" style="margin:0;">En este nivel, puedes:</p>
      <ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    </div>

    ${routeSection(r.level, inst.slug || (r.institution || "").toLowerCase())}

    ${emailNotice()}

    ${cta}

    ${inst.slug === "eam" ? `<p class="muted" style="font-size:13px; text-align:center; margin-top:14px;">¿Dudas? Escríbenos a <b>info.eam@tweetalig.edu.co</b></p>` : ""}

    <p class="muted" style="font-size:12.5px; margin-top:22px; text-align:center;">
      Este resultado es válido para el periodo académico 2026-2. Puedes cerrar esta ventana.
    </p>`;
  waiting.style.display = "none";
  view.style.display = "block";
}

// ---------- Disuasivos: sin menú contextual ni atajos de inspección ----------
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  const k = (e.key || "").toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === "F12" || (mod && e.shiftKey && ["i", "j", "c", "k"].includes(k)) || (mod && ["u", "s"].includes(k)) || (e.metaKey && e.altKey && ["i", "j", "c", "u"].includes(k))) {
    e.preventDefault(); e.stopPropagation();
  }
}, true);
</script>
</body>
</html>
