<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Tweetalig — Piloto Examen de Ubicación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-center">
  <div class="card">
    <div class="eyebrow">Piloto · Funcionarios Tweetalig</div>
    <h1>Examen de ubicación<br>de inglés</h1>
    <p class="muted">Este es un piloto interno para calibrar el examen antes de aplicarlo a los estudiantes. Toma unos 65 minutos. Ingresa el usuario y la contraseña que te compartieron.</p>

    <label for="userInput">Usuario</label>
    <input type="text" id="userInput" placeholder="Tu usuario" autocomplete="off">

    <label for="passInput">Contraseña</label>
    <input type="text" id="passInput" placeholder="Tu contraseña" autocomplete="off">

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn-primary" id="startBtn">Ingresar</button>
  </div>
</div>

<script type="module">
  import { validateLogin } from "./js/exam-engine.js";

  const btn = document.getElementById("startBtn");
  const userInput = document.getElementById("userInput");
  const passInput = document.getElementById("passInput");
  const errorMsg = document.getElementById("errorMsg");

  async function attemptLogin() {
    const username = userInput.value.trim();
    const password = passInput.value.trim();
    if (!username || !password) {
      errorMsg.textContent = "Ingresa tu usuario y contraseña.";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Verificando...";
    errorMsg.textContent = "";

    try {
      const result = await validateLogin(username, password);
      if (!result.ok) {
        errorMsg.textContent = result.reason;
        btn.disabled = false;
        btn.textContent = "Ingresar";
        return;
      }
      sessionStorage.setItem("username", username);
      sessionStorage.setItem("participantName", result.name);
      sessionStorage.setItem("participantEmail", result.email || "");
      window.location.href = "exam.html";
    } catch (e) {
      console.error(e);
      errorMsg.textContent = "Hubo un problema de conexión. Intenta de nuevo.";
      btn.disabled = false;
      btn.textContent = "Ingresar";
    }
  }

  btn.addEventListener("click", attemptLogin);
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
</script>

</body>
</html>
