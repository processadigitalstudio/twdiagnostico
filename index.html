<!DOCTYPE html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<title>Examen Diagnóstico de Inglés — Tweetalig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="notranslate">

<div class="page-center top">
  <div class="card landing">
    <div class="brand-bar" id="brandBar"></div>

    <div class="login-box" style="max-width:420px; margin:8px auto 0;">
      <label for="cedulaInput" style="margin-top:0;">Número de cédula</label>
      <input type="text" id="cedulaInput" inputmode="numeric" placeholder="Solo números" autocomplete="off">

      <label for="passInput">Contraseña de la sesión</label>
      <input type="text" id="passInput" placeholder="La indica el supervisor" autocomplete="off" autocapitalize="off" spellcheck="false">

      <div class="error-msg" id="errorMsg"></div>
      <button class="btn-primary" id="startBtn">Ingresar</button>
      <p class="muted" style="font-size:12.5px; margin-top:12px;">La contraseña distingue mayúsculas y minúsculas.</p>
    </div>

    <div class="legit-foot">
      © Tweetalig Centro de Idiomas · Examen diagnóstico de uso exclusivo para personas autorizadas. El contenido está protegido y su reproducción total o parcial está prohibida.
    </div>
  </div>
</div>

<script type="module">
  import { loginToGroup } from "./js/exam-engine.js";
  import { resolveInstitution, renderBrand, slugFromLocation } from "./js/institutions.js";

  const params = new URLSearchParams(location.search);
  const urlSlug = slugFromLocation();
  renderBrand(document.getElementById("brandBar"), resolveInstitution(urlSlug));

  const btn = document.getElementById("startBtn");
  const cedulaInput = document.getElementById("cedulaInput");
    const passInput = document.getElementById("passInput");
  const errorMsg = document.getElementById("errorMsg");

  async function attemptLogin() {
    btn.disabled = true;
    btn.textContent = "Verificando...";
    errorMsg.textContent = "";
    try {
      const r = await loginToGroup({ cedula: cedulaInput.value, password: passInput.value });
      if (!r.ok) {
        errorMsg.textContent = r.reason;
        btn.disabled = false;
        btn.textContent = "Ingresar";
        return;
      }
      sessionStorage.setItem("participantId", r.participantId);
      sessionStorage.setItem("cedula", r.cedula);
      sessionStorage.setItem("participantName", r.name);
      sessionStorage.setItem("groupId", r.groupId);
      sessionStorage.setItem("groupName", r.groupName);
      sessionStorage.setItem("institution", r.institution || urlSlug || "tweetalig");
      sessionStorage.setItem("profile", JSON.stringify(r.profile || {}));
      if (r.resume) sessionStorage.setItem("resume", JSON.stringify(r.resume)); else sessionStorage.removeItem("resume");
      window.location.href = "exam.html";
    } catch (e) {
      console.error(e);
      errorMsg.textContent = "Hubo un problema de conexión. Intenta de nuevo.";
      btn.disabled = false;
      btn.textContent = "Ingresar";
    }
  }

  btn.addEventListener("click", attemptLogin);
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); });
  cedulaInput.addEventListener("keydown", (e) => { if (e.key === "Enter") passInput.focus(); });
</script>

</body>
</html>
